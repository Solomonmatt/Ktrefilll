<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./ktrefill-theme/style.css?v=20260726" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="./index.html"><img src="./ktrefill-theme/images/logo.webp" alt="KT Refill Logo" class="logo-img"></a>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container cta-card">
          <div>
            <p class="eyebrow">Sign In</p>
            <h2>SignIn</h2>
            <p>Keep me signed in and access your dashboard, orders, and wallet history.</p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="form-card auth-card">
            <div class="auth-header">
              <div>
                <p class="eyebrow">Access your account</p>
                <h2 id="auth-panel-title">Sign In</h2>
                <p id="auth-panel-copy">Keep me signed in and access your dashboard, orders, and wallet history.</p>
              </div>
              <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-auth-mode="signin">Sign In</button>
                <button type="button" class="auth-tab" data-auth-mode="signup">Sign Up</button>
              </div>
            </div>

            <div class="social-login">
              <p>Continue with</p>
              <div class="social-buttons">
                <button type="button" class="btn btn-secondary social-button" data-social-login="google">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5c0-.65-.05-1.28-.14-1.89H12v3.58h4.92c-.21 1.18-.84 2.18-1.8 2.86v2.38h2.91c1.7-1.56 2.67-3.87 2.67-6.93z"></path><path d="M12 22c2.43 0 4.46-.8 5.95-2.17l-2.91-2.38c-.82.55-1.86.88-3.04.88-2.34 0-4.33-1.58-5.04-3.71H3.98v2.33C5.45 19.97 8.49 22 12 22z"></path><path d="M6.96 13.62A5.98 5.98 0 0 1 6.6 12c0-.42.07-.83.16-1.22V8.45H3.98A8.02 8.02 0 0 0 3 12c0 1.27.3 2.47.83 3.55l3.13-1.93z"></path><path d="M12 5.5c1.32 0 2.5.45 3.42 1.34l2.57-2.57C16.44 2.78 14.43 2 12 2 8.49 2 5.45 4.03 3.98 6.45l3.13 2.33C7.67 6.98 9.66 5.5 12 5.5z"></path></svg>
                  Google
                </button>
                <button type="button" class="btn btn-secondary social-button" data-social-login="facebook">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3V2z"></path></svg>
                  Facebook
                </button>
                <button type="button" class="btn btn-secondary social-button" data-social-login="apple">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16.65 8.85c.16-.45.25-.93.25-1.43 0-2.93-2.37-5.3-5.3-5.3a5.5 5.5 0 0 0-4.62 2.57 5.76 5.76 0 0 1 3.6 1.21 5.29 5.29 0 0 1 2.84-.95c1.66 0 3.05 1.01 3.64 2.47a5.5 5.5 0 0 0-3.33 1.12 5.31 5.31 0 0 0-1.4 1.85z"></path><path d="M12.5 12.15c-1.99 0-3.28 1.21-4.24 1.21-.98 0-2.47-1.16-4.06-1.16a7.64 7.64 0 0 0-.05 3.07c.1.47.38 1.48.92 2.42.65 1.14 2.1 3.24 4.16 3.25 1.03 0 1.24-.66 2.33-.66 1.08 0 1.25.66 2.35.66 2.06-.01 3.56-2.15 4.22-3.29.53-.93.8-1.92.9-2.4a7.68 7.68 0 0 0-.04-3.05c-1.63 0-2.92 1.16-3.91 1.16-.93 0-2.28-1.25-4.1-1.25z"></path></svg>
                  Apple
                </button>
              </div>
            </div>

            <div class="form-divider"><span>or continue with email</span></div>

            <form class="service-form auth-form" id="signin-form" data-auth-mode="signin">
              <div class="form-grid auth-fields">
                <label class="form-field auth-name-field" hidden>
                  <span>Full name</span>
                  <input type="text" name="name" placeholder="Your full name" />
                </label>
                <label class="form-field">
                  <span>Email address</span>
                  <input type="email" name="email" placeholder="you@example.com" required />
                </label>
                <label class="form-field">
                  <span>Password</span>
                  <input type="password" name="password" placeholder="Create a password" required />
                </label>
                <label class="form-field auth-confirm-password-field" hidden>
                  <span>Confirm password</span>
                  <input type="password" name="confirmPassword" placeholder="Confirm your password" />
                </label>
                <div class="auth-helper-row">
                  <label class="form-field remember-field">
                    <input type="checkbox" name="rememberMe" />
                    <span>Remember me</span>
                  </label>
                  <button type="button" class="auth-forgot-password">Forgot password?</button>
                </div>
              </div>
              <div class="hero-actions auth-actions">
                <button class="btn btn-primary auth-submit-btn" type="submit">Login</button>
              </div>
              <div class="status-message"></div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="./ktrefill-theme/script.js"></script>
  </body>
</html>
