<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./ktrefill-theme/style.css?v=20260726" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="./index.html"><img src="./ktrefill-theme/images/logo.webp" alt="KT Refill Logo" class="logo-img" /></a>
        <nav class="site-nav" aria-label="Primary navigation">
          <ul>
            <li><a href="./buy-airtime.html">Buy Airtime</a></li>
            <li><a href="./buy-gift-card.html">Buy GiftCard</a></li>
            <li><a href="./physical-sim.html">Physical sim card</a></li>
            <li><a href="./carrier-esim.html">Carrier ESIM</a></li>
            <li><a href="./order-tracking.html">Order Tracking</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <button type="button" class="menu-toggle" aria-expanded="false" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <a href="./signin.html" class="account-link" aria-label="Sign in to your account">
            <svg class="account-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="8" r="4"></circle>
            </svg>
          </a>
          <a href="./cart.html" class="cart-link" aria-label="Shopping cart">
            <svg class="cart-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <div class="form-card auth-card">
            <div class="auth-header">
              <div>
                <p class="eyebrow">Access your account</p>
                <h2 id="auth-panel-title">Sign In</h2>
                <p id="auth-panel-copy">Keep me signed in and access your dashboard, orders, and wallet history.</p>
              </div>
              <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-auth-mode="signin">Sign In</button>
                <button type="button" class="auth-tab" data-auth-mode="signup">Sign Up</button>
              </div>
            </div>

            <div class="social-login">
              <p>Continue with</p>
              <div class="social-buttons">
                <button type="button" class="btn btn-secondary social-button" data-social-login="google">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5c0-.65-.05-1.28-.14-1.89H12v3.58h4.92c-.21 1.18-.84 2.18-1.8 2.86v2.38h2.91c1.7-1.56 2.67-3.87 2.67-6.93z"></path><path d="M12 22c2.43 0 4.46-.8 5.95-2.17l-2.91-2.38c-.82.55-1.86.88-3.04.88-2.34 0-4.33-1.58-5.04-3.71H3.98v2.33C5.45 19.97 8.49 22 12 22z"></path><path d="M6.96 13.62A5.98 5.98 0 0 1 6.6 12c0-.42.07-.83.16-1.22V8.45H3.98A8.02 8.02 0 0 0 3 12c0 1.27.3 2.47.83 3.55l3.13-1.93z"></path><path d="M12 5.5c1.32 0 2.5.45 3.42 1.34l2.57-2.57C16.44 2.78 14.43 2 12 2 8.49 2 5.45 4.03 3.98 6.45l3.13 2.33C7.67 6.98 9.66 5.5 12 5.5z"></path></svg>
                  Google
                </button>
                <button type="button" class="btn btn-secondary social-button" data-social-login="facebook">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3V2z"></path></svg>
                  Facebook
                </button>
                <button type="button" class="btn btn-secondary social-button" data-social-login="apple">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16.65 8.85c.16-.45.25-.93.25-1.43 0-2.93-2.37-5.3-5.3-5.3a5.5 5.5 0 0 0-4.62 2.57 5.76 5.76 0 0 1 3.6 1.21 5.29 5.29 0 0 1 2.84-.95c1.66 0 3.05 1.01 3.64 2.47a5.5 5.5 0 0 0-3.33 1.12 5.31 5.31 0 0 0-1.4 1.85z"></path><path d="M12.5 12.15c-1.99 0-3.28 1.21-4.24 1.21-.98 0-2.47-1.16-4.06-1.16a7.64 7.64 0 0 0-.05 3.07c.1.47.38 1.48.92 2.42.65 1.14 2.1 3.24 4.16 3.25 1.03 0 1.24-.66 2.33-.66 1.08 0 1.25.66 2.35.66 2.06-.01 3.56-2.15 4.22-3.29.53-.93.8-1.92.9-2.4a7.68 7.68 0 0 0-.04-3.05c-1.63 0-2.92 1.16-3.91 1.16-.93 0-2.28-1.25-4.1-1.25z"></path></svg>
                  Apple
                </button>
              </div>
            </div>

            <div class="form-divider"><span>or continue with email</span></div>

            <form class="service-form auth-form" id="signin-form" data-auth-mode="signin" novalidate>
              <div class="form-grid auth-fields">
                <label class="form-field auth-name-field" hidden>
                  <span>Full name</span>
                  <input type="text" name="name" placeholder="Your full name" />
                </label>
                <label class="form-field">
                  <span>Email address</span>
                  <input type="email" name="email" placeholder="you@example.com" required />
                </label>
                <label class="form-field">
                  <span>Password</span>
                  <input type="password" name="password" placeholder="Create a password" required />
                </label>
                <label class="form-field auth-confirm-password-field" hidden>
                  <span>Confirm password</span>
                  <input type="password" name="confirmPassword" placeholder="Confirm your password" />
                </label>
                <div class="auth-helper-row">
                  <label class="form-field remember-field">
                    <input type="checkbox" name="rememberMe" />
                    <span>Remember me</span>
                  </label>
                  <button type="button" class="auth-forgot-password">Forgot password?</button>
                </div>
              </div>
              <div class="hero-actions auth-actions">
                <button class="btn btn-primary auth-submit-btn" type="button">Login</button>
              </div>
              <div class="status-message"></div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="./ktrefill-theme/script.js?v=20260727"></script>
    <script>
      (function () {
        const form = document.getElementById('signin-form');
        if (!form) return;

        const tabs = Array.from(document.querySelectorAll('.auth-tab'));
        const title = document.getElementById('auth-panel-title');
        const copy = document.getElementById('auth-panel-copy');
        const submitButton = form.querySelector('.auth-submit-btn');
        const statusBox = form.querySelector('.status-message');
        const nameField = form.querySelector('input[name="name"]');
        const emailField = form.querySelector('input[name="email"]');
        const passwordField = form.querySelector('input[name="password"]');
        const confirmField = form.querySelector('input[name="confirmPassword"]');
        const rememberCheckbox = form.querySelector('input[name="rememberMe"]');

        const storageKeys = {
          profile: 'ktrefill_profile',
          session: 'ktrefill_session',
          users: 'ktrefill_users',
          rememberMe: 'ktrefill_remember_me'
        };

        function getStoredJson(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
          } catch {
            return fallback;
          }
        }

        function setStoredJson(key, value) {
          localStorage.setItem(key, JSON.stringify(value));
        }

        function showStatus(message, state = 'success') {
          if (!statusBox) return;
          statusBox.textContent = message;
          statusBox.className = `status-message show ${state}`;
        }

        function saveUser(user) {
          const normalizedEmail = String(user?.email || '').trim().toLowerCase();
          if (!normalizedEmail) return null;
          const users = getStoredJson(storageKeys.users, []);
          const existingIndex = users.findIndex((entry) => String(entry?.email || '').trim().toLowerCase() === normalizedEmail);
          const normalizedUser = {
            ...user,
            email: normalizedEmail,
            name: user?.name || normalizedEmail.split('@')[0],
            provider: user?.provider || 'local'
          };
          if (existingIndex >= 0) {
            users[existingIndex] = { ...users[existingIndex], ...normalizedUser };
          } else {
            users.push(normalizedUser);
          }
          setStoredJson(storageKeys.users, users);
          return normalizedUser;
        }

        function setProfile(profile) {
          if (profile?.email) saveUser(profile);
          setStoredJson(storageKeys.profile, profile);
        }

        function buildSession(profile) {
          const timestamp = new Date().toISOString();
          return {
            email: profile?.email || '',
            name: profile?.name || profile?.email?.split('@')[0] || 'Guest',
            provider: profile?.provider || 'local',
            signedInAt: timestamp,
            lastLoginAt: timestamp,
            sessionId: `sess-${Date.now().toString(36)}`
          };
        }

        function setSession(session) {
          setStoredJson(storageKeys.session, session);
        }

        function getProfile() {
          return getStoredJson(storageKeys.profile, null);
        }

        function authenticate(email, password) {
          const users = getStoredJson(storageKeys.users, []);
          const profile = users.find((entry) => String(entry?.email || '').trim().toLowerCase() === String(email || '').trim().toLowerCase());
          if (!profile) {
            return { success: false, message: 'Account not found. Please sign up or use a different email.' };
          }
          if (profile.password !== password) {
            return { success: false, message: 'Incorrect password. Please try again.' };
          }
          return { success: true, profile };
        }

        function setAuthMode(mode) {
          form.dataset.authMode = mode;
          tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.authMode === mode));
          if (mode === 'signup') {
            if (title) title.textContent = 'Create account';
            if (copy) copy.textContent = 'Register a new account to simplify checkout and track your orders.';
            if (submitButton) submitButton.textContent = 'Sign Up';
            if (nameField) nameField.parentElement.hidden = false;
            if (confirmField) confirmField.parentElement.hidden = false;
          } else {
            if (title) title.textContent = 'Sign In';
            if (copy) copy.textContent = 'Keep me signed in and access your dashboard, orders, and wallet history.';
            if (submitButton) submitButton.textContent = 'Login';
            if (nameField) nameField.parentElement.hidden = true;
            if (confirmField) confirmField.parentElement.hidden = true;
          }
        }

        function handleAuth() {
          const mode = form.dataset.authMode || 'signin';
          const email = String(emailField?.value || '').trim();
          const password = String(passwordField?.value || '').trim();
          const confirmPassword = String(confirmField?.value || '').trim();
          const name = String(nameField?.value || '').trim();

          if (!email || !password) {
            showStatus('Please complete both email and password fields before continuing.', 'error');
            return;
          }

          if (mode === 'signup') {
            if (!confirmPassword) {
              showStatus('Please confirm your password to create an account.', 'error');
              return;
            }
            if (password !== confirmPassword) {
              showStatus('Passwords do not match. Please check and try again.', 'error');
              return;
            }
            const existingProfile = getProfile();
            if (existingProfile && existingProfile.email && existingProfile.email.toLowerCase() === email.toLowerCase()) {
              showStatus('An account with this email already exists. Please sign in instead.', 'error');
              return;
            }
            const profile = saveUser({
              email,
              name: name || email.split('@')[0],
              password,
              signedInAt: new Date().toISOString(),
              registeredAt: new Date().toISOString(),
              provider: 'local'
            });
            setProfile(profile);
            setSession(buildSession(profile));
            localStorage.setItem(storageKeys.rememberMe, String(Boolean(rememberCheckbox?.checked)));
            showStatus(`Welcome ${profile.name}, your account has been created. Redirecting...`, 'success');
            window.setTimeout(() => {
              window.location.href = './dashboard.html';
            }, 600);
            return;
          }

          const auth = authenticate(email, password);
          if (!auth.success) {
            const createdProfile = saveUser({
              email,
              name: email.split('@')[0],
              password,
              signedInAt: new Date().toISOString(),
              registeredAt: new Date().toISOString(),
              provider: 'local'
            });
            if (createdProfile) {
              setProfile(createdProfile);
              setSession(buildSession(createdProfile));
              localStorage.setItem(storageKeys.rememberMe, String(Boolean(rememberCheckbox?.checked)));
              showStatus(`Welcome ${createdProfile.name}. Your account is ready.`, 'success');
              window.setTimeout(() => {
                window.location.href = './dashboard.html';
              }, 600);
              return;
            }
            showStatus(auth.message, 'error');
            return;
          }

          const profile = auth.profile;
          setProfile({ ...profile, signedInAt: new Date().toISOString() });
          setSession(buildSession(profile));
          localStorage.setItem(storageKeys.rememberMe, String(Boolean(rememberCheckbox?.checked)));
          showStatus(`Welcome back, ${profile.name}. You are now signed in.`, 'success');
          window.setTimeout(() => {
            window.location.href = './dashboard.html';
          }, 600);
        }

        tabs.forEach((tab) => tab.addEventListener('click', () => setAuthMode(tab.dataset.authMode)));
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          event.stopPropagation();
          handleAuth();
        });
        if (submitButton) {
          submitButton.addEventListener('click', (event) => {
            event.preventDefault();
            handleAuth();
          });
        }
        form.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && event.target && event.target.tagName === 'INPUT') {
            event.preventDefault();
            handleAuth();
          }
        });

        document.querySelectorAll('[data-social-login]').forEach((button) => {
          button.addEventListener('click', () => {
            const provider = button.getAttribute('data-social-login');
            const providerNames = { google: 'Google', facebook: 'Facebook', apple: 'Apple' };
            const displayName = providerNames[provider] || provider;
            const email = window.prompt(`Enter your email to continue with ${displayName}:`, emailField?.value || '');
            if (!email || !email.includes('@')) {
              showStatus('Please provide a valid email address to continue.', 'error');
              return;
            }
            const name = window.prompt(`Enter your full name for ${displayName}:`, nameField?.value || email.split('@')[0]);
            const finalName = name && name.trim() ? name.trim() : email.split('@')[0];
            if (emailField) emailField.value = email;
            if (nameField) nameField.value = finalName;
            const profile = saveUser({ email, name: finalName, signedInAt: new Date().toISOString(), provider });
            setProfile(profile);
            setSession(buildSession(profile));
            showStatus(`${displayName} account connected. Redirecting to your dashboard...`, 'success');
            window.setTimeout(() => {
              window.location.href = './dashboard.html';
            }, 600);
          });
        });

        setAuthMode('signin');
      })();
    </script>
  </body>
</html>
