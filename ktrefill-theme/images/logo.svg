<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gold decorative element -->
  <rect x="0" y="16" width="8" height="8" fill="#d8a542" rx="1"/>
  
  <!-- KT Text -->
  <text x="16" y="28" font-family="Inter, sans-serif" font-size="20" font-weight="800" letter-spacing="0.05em" fill="#f8f7f2">KT</text>
  
  <!-- Refill Text -->
  <text x="50" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="0.05em" fill="#f8f7f2">REFILL</text>
  
  <!-- Gold underline accent -->
  <rect x="0" y="33" width="175" height="1" fill="url(#gradient)"/>
  
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="175" y2="0">
      <stop offset="0%" stop-color="#d8a542" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d8a542"/>
      <stop offset="100%" stop-color="#d8a542" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
